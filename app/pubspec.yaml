name: mauqa
description: Mauqa — discover, qualify, track and apply for opportunities in Pakistan.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.6.0
  intl: any
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  file_picker: ^10.3.3
  shared_preferences: ^2.3.2
  table_calendar: ^3.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
